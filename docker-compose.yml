services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ct-spleen-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/best.pth
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - spleen-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ct-spleen-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - spleen-network

networks:
  spleen-network:
    driver: bridge
